[project]
name = "cvpr2015-cnn-reid"
version = "2.0.0"
description = "PyTorch implementation of CVPR 2015 'An Improved Deep Learning Architecture for Person Re-Identification' - Educational refactoring with modern frameworks"
authors = [
    {name = "Ning Ding", email = "dingning@sjtu.edu.cn"},
    {name = "Refactored by AI", email = "refactor@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["person-reidentification", "deep-learning", "pytorch", "computer-vision", "siamese-network"]

dependencies = [
    # Core Deep Learning
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pytorch-lightning>=2.4.0",

    # Data Processing
    "albumentations>=1.4.0",
    "opencv-python>=4.10.0",
    "pillow>=10.4.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "h5py>=3.11.0",

    # Configuration & Utils
    "pyyaml>=6.0.2",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",

    # Visualization
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",

    # Experiment Tracking
    "tensorboard>=2.17.0",
    "wandb>=0.18.0",

    # Utilities
    "rich>=13.9.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    # Jupyter
    "jupyter>=1.0.0",
    "jupyterlab>=4.2.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.2.0",

    # Code Quality
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",

    # Documentation
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

all = [
    "cvpr2015-cnn-reid[dev]",
]

[project.scripts]
reid-train = "src.scripts.train:main"
# reid-eval and reid-prepare-data removed - modules do not exist yet
# TODO: Add when evaluate.py and prepare_data.py are implemented

[project.urls]
Homepage = "https://github.com/Ning-Ding/Implementation-CVPR2015-CNN-for-ReID"
Repository = "https://github.com/Ning-Ding/Implementation-CVPR2015-CNN-for-ReID"
Documentation = "https://github.com/Ning-Ding/Implementation-CVPR2015-CNN-for-ReID/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | legacy
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["legacy/", "tests/", "notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
]
